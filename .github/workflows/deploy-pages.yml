# Publishes the web/ folder to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Fail early if the model files were not committed
        run: |
          test -s web/models/mobilenet_v3_small.tflite || {
            echo "::error::web/models/mobilenet_v3_small.tflite is missing. Run scripts/fetch_models.sh and commit web/models/."
            exit 1
          }

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the web folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
